# 檢查與測試：push 到 master 與 pull request 時執行
name: Tests

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check # 格式、lint 與型別檢查
            - run: npm test
