<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>迷宮問答</title>
  </head>
  <body>
    <div id="app">
      <div id="game" class="game" hidden>
        <header class="status-bar">
          <span id="question-number"></span>
          <span id="lives" class="lives" role="img"></span>
        </header>
        <div id="stage" class="stage">
          <canvas id="maze-canvas"></canvas>
          <div id="stage-message" class="stage-message" aria-live="polite" hidden></div>
        </div>
        <footer class="prompt-bar">
          <img id="prompt-image" class="prompt-image" alt="" hidden />
          <p id="prompt-text" class="prompt-text quiz-text" aria-live="polite"></p>
        </footer>
      </div>
      <aside id="debug-panel" class="debug-panel" hidden></aside>
      <!-- 選單與各種畫面都放在覆蓋層裡 -->
      <div id="overlay" class="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
